include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # Imports: one style everywhere keeps the dependency-rule test reliable.
    always_use_package_imports: true
    # Async hygiene: a forgotten `await` is a silent bug.
    unawaited_futures: true
    # Logging goes through ErrorReporter / debugPrint, never print().
    avoid_print: true
    # Style that reduces diff noise.
    prefer_final_locals: true
    prefer_const_declarations: true
    require_trailing_commas: false
    sort_constructors_first: false
